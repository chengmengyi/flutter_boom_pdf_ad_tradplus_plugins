group = "com.boom.pdf.ad.tradplus.flutter_boom_pdf_ad_tradplus_plugins"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.boom.pdf.ad.tradplus.flutter_boom_pdf_ad_tradplus_plugins"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "consumer-rules.pro"
    }

    dependencies {
        // tradplus_sdk intentionally declares the native core as compileOnly.
        // The adapter supplies the runtime core; individual mediation network
        // adapters remain an app-level choice.
        implementation("com.tradplusad:tradplus:15.4.0.1")
        // compare-price-release.aar contains classes only. Its classes.jar is
        // embedded here so Flutter host apps receive it transitively.
        implementation files("libs/compare-price.jar")
        // TP Exchange/Adx parses bidding payloads with Gson but its POM does
        // not declare Gson transitively. Supply it here for every host App.
        implementation("com.google.code.gson:gson:2.10.1")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
